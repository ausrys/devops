version: 3
projects:
  - dir: .
    autoplan:
      when_modified: ["*.tf", "*.tfvars"]
      enabled: true
    workflow: custom
    terraform_version: v1.6.6

workflows:
  custom:
    plan:
      steps:
        - run: terraform init
        - run: terraform plan -var-file=secrets.auto.tfvars
    apply:
      steps:
        - run: terraform apply -auto-approve -var-file=secrets.auto.tfvars
